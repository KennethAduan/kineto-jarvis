[[permission]]
identifier = "voice"
description = "User-initiated local dictation, fixed speech-model setup and read-aloud. No arbitrary URLs, file paths or commands."
commands.allow = ["voice_status", "voice_download_model", "voice_start_recording", "voice_finish_recording", "voice_cancel", "voice_speak_message", "voice_stop_speaking", "speech_status", "speech_save_preferences", "speech_preview", "speech_download_model", "voice_mode_status", "voice_mode_download", "voice_mode_start", "voice_mode_heartbeat", "voice_mode_resume", "voice_mode_stop"]
