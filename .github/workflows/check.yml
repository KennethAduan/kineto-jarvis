name: Desktop checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Build-time libclang for Whisper's bindgen; Python is never bundled with the app.
      - run: python -m pip install libclang==18.1.1
      - name: Locate libclang
        shell: bash
        run: python -c "import clang.cindex, os; open(os.environ['GITHUB_ENV'], 'a').write('LIBCLANG_PATH=' + clang.cindex.Config.library_path + '\n')"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: pnpm tauri build --no-bundle
